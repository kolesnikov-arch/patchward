name: "patchward check"
description: >-
  Lists the expectations a pull request stops checking, as before/after pairs.
  Reads the diff only — runs nothing, blocks nothing, judges nothing.
author: "Dmitriy Kolesnikov"

branding:
  icon: "alert-triangle"
  color: "yellow"

inputs:
  fail-on:
    description: >-
      Fail the check at this severity or above: high | medium | any | never.
      Default `never` — report, do not block. Earn the block.
    required: false
    default: "never"
  comment:
    description: >-
      Post the result as a pull request comment (true/false). Default `true`.
      What gets posted is the retracted-expectation list — the lines that existed
      before this change and do not after it, shown as before/after pairs — and
      nothing else. It states no verdict, so there is nothing in it to be wrong
      about; a rename and a weakened test look the same, and the reviewer settles
      that in a glance. Set `false` to keep it in the job summary only.
    required: false
    default: "true"
  test-glob:
    description: >-
      Extra regex marking a path as a test file, one per line.
    required: false
    default: ""
  base:
    description: "Base ref to diff against. Defaults to the PR base."
    required: false
    default: ""

outputs:
  stops-checking:
    description: "How many expectations this change retracts"
    value: ${{ steps.run.outputs.stops_checking }}
  severity:
    description: "0-3, from the verdict side of the tool"
    value: ${{ steps.run.outputs.severity }}
  verdict:
    description: "clean | note | review | self-graded"
    value: ${{ steps.run.outputs.verdict }}
  findings:
    description: "JSON array of findings"
    value: ${{ steps.run.outputs.findings }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install patchward check
      shell: bash
      # Pinned on purpose. An unpinned install makes `@check-v0.2.3` mean
      # "this action, plus whatever was on PyPI the morning you ran it", which
      # is not a thing a pinned reference should mean.
      run: pip install --quiet "patchward-check==0.2.3"

    - name: Run patchward check
      id: run
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        TEST_GLOB: ${{ inputs.test-glob }}
        BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        base="${BASE:-${{ github.event.pull_request.base.sha }}}"
        head="${{ github.event.pull_request.head.sha || github.sha }}"
        [ -n "$base" ] || base="$(git rev-parse HEAD~1)"

        # `actions/checkout` clones one commit by default, so the base of a
        # pull request is usually not in the local object database and every
        # `git diff` against it fails. Fetch it; if that is not possible, fall
        # back to the previous commit and say so rather than reporting an empty
        # diff as "this change stops checking nothing".
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
        fi
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "::warning::patchward: base commit $base is not available — " \
               "add 'fetch-depth: 0' to actions/checkout. Comparing against " \
               "HEAD~1 instead."
          base="$(git rev-parse HEAD~1)"
        fi

        args=()
        while IFS= read -r g; do
          [ -n "$g" ] && args+=(--test-glob "$g")
        done <<< "${TEST_GLOB}"

        git diff --unified=3 "$base" "$head" > /tmp/pw.diff || true

        # What a human sees: the retracted expectations, no verdict attached.
        patchward-check --diff /tmp/pw.diff --format retracted-md \
          "${args[@]}" > /tmp/pw.md || true
        patchward-check --diff /tmp/pw.diff --format retracted-json \
          "${args[@]}" > /tmp/pw.retracted.json || true

        # The verdict is still computed, because `fail-on` is built on it. It
        # stays a machine output; it is not what gets shown to the author.
        patchward-check --diff /tmp/pw.diff --format json \
          --fail-on never "${args[@]}" > /tmp/pw.json || true

        # Read both reports defensively and in one place. The commands above
        # end in `|| true`, so a failure upstream leaves an empty file rather
        # than no file — and `json.load` on an empty file under `set -e` would
        # fail the whole step for a repository that simply has no test files.
        python - <<'PY'
        import json, os

        def read(path, key, default):
            try:
                with open(path, encoding="utf-8") as f:
                    return json.load(f).get(key, default)
            except Exception:
                return default

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"stops_checking={read('/tmp/pw.retracted.json', 'stops_checking', 0)}\n")
            out.write(f"verdict={read('/tmp/pw.json', 'verdict', 'clean')}\n")
            out.write(f"severity={read('/tmp/pw.json', 'severity', 0)}\n")
            findings = read("/tmp/pw.json", "findings", [])
            out.write("findings=" + json.dumps(findings, ensure_ascii=False) + "\n")
        PY

        cat /tmp/pw.md >> "$GITHUB_STEP_SUMMARY"

        sev=$(grep '^severity=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
        verdict=$(grep '^verdict=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
        case "${FAIL_ON}" in
          high)   limit=3 ;;
          medium) limit=2 ;;
          any)    limit=1 ;;
          *)      limit=99 ;;
        esac
        if [ "$sev" -ge "$limit" ]; then
          echo "::error::patchward: $verdict — this change edits the tests that judge it"
          exit 1
        fi

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && steps.run.outputs.stops_checking != '0' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/pw.md', 'utf8');
          const tag = '<!-- patchward-check -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const existing = await github.rest.issues.listComments({ owner, repo, issue_number });
          const mine = existing.data.find(c => c.body.includes(tag));
          const payload = `${tag}\n${body}`;
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: payload });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
          }
